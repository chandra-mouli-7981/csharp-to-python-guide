<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10. Design A Web Crawler</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1b2430;--muted:#5b6777;--accent:#1f4e79;--accent2:#2f80ed;--line:#d9e0ea;--hot:#e8590c;--code:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#18202a;--ink:#e6edf5;--muted:#9aa8b8;--accent:#6aa9e9;--accent2:#6aa9e9;--line:#2b3744;--hot:#ffa94d;--code:#202b38}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--accent);color:#fff;padding:18px 28px}
header .crumb{font-size:12px;opacity:.85;letter-spacing:.08em;text-transform:uppercase}
header h1{margin:4px 0 4px;font-size:28px}
header p{margin:0;opacity:.92}
header nav{margin-top:10px;font-size:13px}
header nav a{color:#fff;opacity:.9;margin-right:14px}
.progress{height:5px;background:rgba(255,255,255,.25);margin-top:12px;border-radius:3px;overflow:hidden}
.progress div{height:100%;width:0;background:#7bdc8f;transition:width .3s}
.layout{display:flex;gap:24px;max-width:1280px;margin:0 auto;padding:20px}
aside{position:sticky;top:12px;align-self:flex-start;width:210px;flex:none;font-size:13px}
aside a{display:block;padding:5px 10px;color:var(--muted);text-decoration:none;border-left:3px solid transparent}
aside a:hover,aside a.on{color:var(--accent);border-left-color:var(--accent2);background:var(--card)}
main{flex:1;min-width:0}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin-bottom:18px}
section h2{margin:0 0 10px;color:var(--accent);font-size:19px}
h3{margin:14px 0 6px;font-size:15px}
code{background:var(--code);padding:1px 5px;border-radius:4px;font:13px Consolas,monospace}
pre{background:var(--code);padding:10px 12px;border-radius:8px;overflow:auto;font:13px/1.45 Consolas,monospace}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--accent);color:#fff;text-align:left;padding:6px 10px}
td{border:1px solid var(--line);padding:6px 10px;vertical-align:top}
tr:nth-child(even) td{background:rgba(127,160,200,.08)}
ul{padding-left:20px;margin:6px 0}
li{margin:3px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 12px}
button:hover{border-color:var(--accent2)}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
.reveal{color:var(--accent2);cursor:pointer;font-style:italic}
.hidden-ans{filter:blur(5px);cursor:pointer;user-select:none}
details{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:0 12px;background:var(--card)}
summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--ink)}
details[open]>summary{color:var(--accent)}
.tools{margin:0 0 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
/* diagrams */
.dgwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.dgmain{flex:1 1 640px;min-width:320px}
.dgpanel{flex:0 1 280px;min-width:240px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:13.5px}
svg.dg{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
svg .edge{stroke:#556;stroke-width:1.8;fill:none;transition:opacity .2s}
svg .edge.dash{stroke-dasharray:7 5}
svg .elabel{font:italic 12px sans-serif;fill:var(--ink)}
svg .elbg{fill:var(--card)}
svg .node rect{stroke-width:2;transition:filter .2s}
svg .node text{font:600 13px sans-serif;fill:#111;pointer-events:none}
svg .node text.sub{font:400 11.5px sans-serif}
svg .node{cursor:pointer}
svg .node:hover rect{filter:brightness(.93)}
svg .node.sel rect{stroke:var(--hot);stroke-width:4}
svg.focus .edge:not(.on),svg.focus .badge:not(.on),svg.focus .elabel:not(.on),svg.focus .elbg:not(.on){opacity:.12}
svg.focus .node:not(.on){opacity:.4}
svg .edge.hot{stroke:var(--hot);stroke-width:3.4;stroke-dasharray:9 6;animation:flow .8s linear infinite}
svg .edge.done{stroke:var(--accent2)}
@keyframes flow{to{stroke-dashoffset:-30}}
svg .badge circle{fill:var(--accent);stroke:#fff;stroke-width:2}
svg .badge text{font:700 12px sans-serif;fill:#fff;text-anchor:middle;pointer-events:none}
svg .badge.cur circle{fill:var(--hot)}
.steps{display:flex;gap:6px;align-items:center;margin:10px 0 6px;flex-wrap:wrap}
.steptext{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--hot);border-radius:6px;padding:8px 12px;min-height:44px}
ol.steplist{margin:8px 0 0;padding-left:22px;font-size:13.5px}
ol.steplist li{cursor:pointer;color:var(--muted)}
ol.steplist li.cur{color:var(--ink);font-weight:600}
.jump{display:inline-block;margin:2px 6px 2px 0;padding:1px 8px;border:1px solid var(--line);border-radius:12px;font-size:12px;cursor:pointer;color:var(--accent2)}
/* script */
.phase{display:flex;gap:12px;border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:10px 12px;transition:background .2s,border-color .2s}
.phase.cur{background:rgba(232,89,12,.09);border-color:var(--hot)}
.phase .tag{flex:0 0 150px}
.phase .tag b{display:block;color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent2)}
.timer{font:600 18px Consolas,monospace}
.check{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.check input{margin-top:5px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media (max-width:900px){aside{display:none}.layout{padding:10px}}
@media print{aside,.tools,.steps,button{display:none!important}header{background:#fff;color:#000}section{break-inside:avoid}.hidden-ans{filter:none}}
</style>
</head>

// ---------- header / nav
document.getElementById('crumb').textContent = 'Chapter ' + D.num;

document.getElementById('tag').textContent = D.tagline;
(function(){

  builder(s); main.appendChild(s); sections.push([id, title]); return s;
}
const ul = items => { const u = $('ul'); items.forEach(t => u.appendChild($('li', null, fmt(t)))); return u; };

function renderDiagram(container, spec, idx){

  const defs = S('defs'); const mk = (id) => { const m = S('marker', {id, viewBox:'0 0 10 10', refX:'9', refY:'5', markerWidth:'7', markerHeight:'7', orient:'auto-start-reverse'});
    m.appendChild(S('path', {d:'M0,0 L10,5 L0,10 z', fill:'#556'})); return m; };

  const badges = [], used = {};
  if (walk) steps.forEach((st, n) => {
    let rec = edges.find(e => e.a===st.a && e.b===st.b), rev = false;
    if (!rec){ rec = edges.find(e => e.a===st.b && e.b===st.a); rev = true; }

    const t = rev ? 0.8 - 0.16*c : 0.2 + 0.16*c;
    const x = rec.p1[0] + (rec.p2[0]-rec.p1[0])*t, y = rec.p1[1] + (rec.p2[1]-rec.p1[1])*t;
    const g = S('g', {class:'badge'}); g.appendChild(S('circle', {cx:x,cy:y,r:11})); const tx = S('text', {x:x,y:y+4}); tx.textContent = n+1; g.appendChild(tx);
    gB.appendChild(g); badges[n] = g; st.edge = rec;
  }); else steps.forEach(st => { st.edge = edges.find(e => e.a===st.a && e.b===st.b); });
  spec.nodes.forEach(([id,label,c,r,kind]) => {
    const [f,s] = KIND[kind] || KIND.service; const [cx,cy] = pos[id]; const g = S('g', {class:'node','data-id':id});
    g.appendChild(S('rect', {x:cx-boxW/2,y:cy-boxH/2,width:boxW,height:boxH,rx:9,fill:f,stroke:s}));
    const ls = label.split('\n'), y0 = cy - (ls.length-1)*8 + 4;
    ls.forEach((l,i) => { const t = S('text', {x:cx,y:y0+i*16,'text-anchor':'middle',class:i?'sub':''}); t.textContent = l; g.appendChild(t); });
    g.addEventListener('click', ev => { ev.stopPropagation(); selectNode(id); });
    gN.appendChild(g); nodeMap[id].g = g;
  });
  svg.appendChild(gE); svg.appendChild(gB); svg.appendChild(gN);
  svg.addEventListener('click', () => clearSel());

  const wrap = $('div', {className:'dgwrap'}), left = $('div', {className:'dgmain'}), panel = $('div', {className:'dgpanel'});
  left.appendChild(svg);
  const ctrl = $('div', {className:'steps'}); const bReset = $('button',null,'&#9198; Reset'), bPrev = $('button',null,'&#9664; Prev'),
    bNext = $('button',{className:'primary'},'Next &#9654;'), bPlay = $('button',null,'&#9654;&#9654; Auto-play');
  const cnt = $('span', {className:'muted'}); ctrl.append(bReset,bPrev,bNext,bPlay,cnt); left.appendChild(ctrl);
  const stext = $('div', {className:'steptext'}); left.appendChild(stext);
  const list = $('ol', {className:'steplist'}); steps.forEach((st,i) => { const li = $('li', null, fmt(st.t)); li.onclick = () => go(i); list.appendChild(li); });
  left.appendChild(list);
  wrap.append(left, panel); container.appendChild(wrap);

  let cur = -1, timer = null;
  function clearHot(){ edges.forEach(e => e.ln.classList.remove('hot','done')); badges.forEach(b => b && b.classList.remove('cur'));
    spec.nodes.forEach(n => nodeMap[n[0]].g.classList.remove('on')); svg.classList.remove('focus'); }
  function go(i){
    clearSel(true); clearHot(); cur = Math.max(-1, Math.min(steps.length-1, i));
    steps.forEach((st,k) => { if (st.edge) { if (k < cur) st.edge.ln.classList.add('done'); }});
    if (cur >= 0){ const st = steps[cur]; if (st.edge) st.edge.ln.classList.add('hot'); if (badges[cur]) badges[cur].classList.add('cur');
      [st.a, st.b].forEach(id => nodeMap[id].g.classList.add('on')); svg.classList.add('focus');
      if (st.edge) st.edge.els.forEach(el => el.classList.add('on')); if (badges[cur]) badges[cur].classList.add('on');
      stext.innerHTML = '<b>Step ' + (cur+1) + ' of ' + steps.length + ':</b> ' + fmt(st.t); }
    else stext.innerHTML = '<span class="muted">Press <b>Next</b> to walk through the request flow one hop at a time, or click any component for details.</span>';
    [...list.children].forEach((li,k) => li.classList.toggle('cur', k === cur));
    cnt.textContent = steps.length ? (cur+1) + ' / ' + steps.length : '';
  }
  function stopPlay(){ if (timer){ clearInterval(timer); timer = null; bPlay.innerHTML = '&#9654;&#9654; Auto-play'; } }
  bReset.onclick = () => { stopPlay(); go(-1); };
  bPrev.onclick = () => { stopPlay(); go(cur-1); };
  bNext.onclick = () => { stopPlay(); go(cur+1 >= steps.length ? 0 : cur+1); };
  bPlay.onclick = () => { if (timer) return stopPlay(); bPlay.innerHTML = '&#9632; Stop'; if (cur >= steps.length-1) go(-1);
    timer = setInterval(() => { if (cur >= steps.length-1) return stopPlay(); go(cur+1); }, 1800); };
  if (!steps.length){ ctrl.style.display = 'none'; list.style.display = 'none'; }

  function clearSel(keep){ spec.nodes.forEach(n => nodeMap[n[0]].g.classList.remove('sel')); if (!keep){ clearHot(); cur = -1; stext.innerHTML = '<span class="muted">Press <b>Next</b> to walk through the request flow one hop at a time, or click any component for details.</span>';
      [...list.children].forEach(li => li.classList.remove('cur')); cnt.textContent = steps.length ? '0 / ' + steps.length : '';
      edges.forEach(e => e.els.forEach(el => el.classList.remove('on'))); badges.forEach(b => b && b.classList.remove('on')); }
    panelDefault(); }
  function panelDefault(){ panel.innerHTML = '<b>Click a component</b><p class="muted">to see what it does, what talks to it, and which deep-dive section covers it. Use <i>Next</i> to animate the request flow.</p>' +
    '<p class="muted"><span style="color:#BF9000">&#9632;</span> client &nbsp;<span style="color:#7030A0">&#9632;</span> load balancer &nbsp;<span style="color:#2F5597">&#9632;</span> service &nbsp;<span style="color:#548235">&#9632;</span> database &nbsp;<span style="color:#C55A11">&#9632;</span> cache &nbsp;<span style="color:#C00000">&#9632;</span> queue &nbsp;<span style="color:#385723">&#9632;</span> storage &nbsp;<span style="color:#595959">&#9632;</span> external</p>'; }
  const STOP = new Set(['service','server','servers','system','data','store','queue','cache','storage','user','users','client','node','nodes','the','and','for','api','new']);
  function selectNode(id){
    stopPlay(); clearHot(); cur = -1; cnt.textContent = steps.length ? '0 / ' + steps.length : ''; [...list.children].forEach(li => li.classList.remove('cur'));
    spec.nodes.forEach(n => nodeMap[n[0]].g.classList.remove('sel')); nodeMap[id].g.classList.add('sel');
    edges.forEach(e => e.els.forEach(el => el.classList.remove('on'))); badges.forEach(b => b && b.classList.remove('on'));
    const inb = [], outb = []; edges.forEach(e => { const hit = e.a === id || e.b === id; if (hit){ e.els.forEach(el => el.classList.add('on'));
      const both = (spec.edges.find(x => x[0]===e.a && x[1]===e.b)||[])[3]||''; if (e.b === id || both.includes('<')) inb.push(e); if (e.a === id || both.includes('<')) outb.push(e); }});
    spec.nodes.forEach(n => { const on = n[0]===id || edges.some(e => (e.a===id && e.b===n[0]) || (e.b===id && e.a===n[0])); if (on) nodeMap[n[0]].g.classList.add('on'); });
    svg.classList.add('focus'); stext.innerHTML = '<span class="muted">Showing connections of <b>' + esc(nodeLabel(id)) + '</b>. Click empty space to reset.</span>';
    const ls = nodeMap[id].label.split('\n'); let h = '<b style="font-size:15px">' + esc(ls[0]) + '</b>'; if (ls.length > 1) h += '<div class="muted">' + esc(ls.slice(1).join(' \u00b7 ')) + '</div>';
    h += '<p>' + (info[id] ? fmt(info[id]) : '<span class="muted">Role: ' + esc(ls.slice(1).join(', ') || 'component in this design') + '. (Add notes in this chapter\'s extras file to show a longer description.)</span>') + '</p>';
    const li = (arr, side) => arr.length ? '<div><b>' + side + '</b><ul>' + arr.map(e => '<li>' + esc(nodeLabel(side==='Receives from' ? (e.b===id?e.a:e.b) : (e.a===id?e.b:e.a))) + (e.label ? ' <span class="muted">(' + esc(e.label) + ')</span>' : '') + '</li>').join('') + '</ul></div>' : '';
    h += li(inb, 'Receives from') + li(outb, 'Sends to');
    const words = ls[0].toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w));
    const hits = []; (D.deep||[]).forEach(([hd], k) => { const l = hd.toLowerCase(); if (words.some(w => l.includes(w))) hits.push(k); });
    if (hits.length){ h += '<div style="margin-top:8px"><b>Related deep dive</b><br>' + hits.slice(0,4).map(k => '<span class="jump" data-k="' + k + '">' + esc(D.deep[k][0].replace(/\(.*\)/,'').slice(0,46)) + '</span>').join('') + '</div>'; }
    panel.innerHTML = h; panel.querySelectorAll('.jump').forEach(j => j.onclick = () => { const d = document.getElementById('deep-' + j.dataset.k); d.open = true; d.scrollIntoView({behavior:'smooth', block:'start'}); });
  }
  panelDefault(); go(-1);
}

// ---------- sections
section('problem', D.problem_title || 'Problem statement', s => {
  s.appendChild($('p', null, fmt(D.problem)));
  if (D.why) s.appendChild($('p', null, '<b>Why interviewers ask it:</b> ' + fmt(D.why)));
});
if (D.clarify) section('clarify', 'Clarifying questions (try answering first)', s => {
  const t = $('div', {className:'tools'}); const b = $('button', null, 'Reveal all answers'); t.appendChild(b); t.appendChild($('span', {className:'muted'}, 'Cover the right column, say your assumption out loud, then click to reveal.')); s.appendChild(t);
  const tb = $('table', null, '<tr><th>Question</th><th>Assumed answer</th></tr>');
  D.clarify.forEach(([q,a]) => { const tr = $('tr'); tr.appendChild($('td', null, fmt(q))); const td = $('td', {className:'hidden-ans', title:'Click to reveal'}, fmt(a)); td.onclick = () => td.classList.remove('hidden-ans'); tr.appendChild(td); tb.appendChild(tr); });
  b.onclick = () => tb.querySelectorAll('.hidden-ans').forEach(td => td.classList.remove('hidden-ans')); s.appendChild(tb);
});
if (D.functional || D.nonfunctional) section('req', 'Requirements', s => {
  if (D.functional){ s.appendChild($('h3', null, 'Functional')); s.appendChild(ul(D.functional)); }
  if (D.nonfunctional){ s.appendChild($('h3', null, 'Non-functional')); s.appendChild(ul(D.nonfunctional)); }
});
if (D.estimates) section('est', D.estimates_title || 'Back-of-the-envelope estimation', s => s.appendChild(ul(D.estimates)));
if (D.api) section('api', 'API / data model', s => s.appendChild($('pre', null, esc(D.api.join('\n')))));
if (D.diagrams || D.flow) section('hl', D.hl_title || 'High-level design', s => {
  (D.diagrams || []).forEach((dg, i) => { if (dg.title) s.appendChild($('h3', null, esc(dg.title))); const box = $('div'); s.appendChild(box); renderDiagram(box, dg, i);
    if (dg.caption) s.appendChild($('p', {className:'muted'}, esc(dg.caption))); });
  if (D.flow){ s.appendChild($('h3', null, 'Request flow')); s.appendChild(ul(D.flow)); }
});
section('deep', D.deep_title || 'Deep dive', s => {
  const t = $('div', {className:'tools'}); const a = $('button', null, 'Expand all'), c = $('button', null, 'Collapse all'); t.append(a, c); s.appendChild(t);
  const all = [];
  (D.deep || []).forEach(([hd, items], k) => { const d = $('details', {id:'deep-' + k}); d.appendChild($('summary', null, fmt(hd)));
    const tx = items.filter(i => !i.startsWith('```')); if (tx.length) d.appendChild(ul(tx));
    items.filter(i => i.startsWith('```')).forEach(code => d.appendChild($('pre', null, esc(code.replace(/^`+|`+$/g,'').replace(/^\n+|\n+$/g,'')))));
    s.appendChild(d); all.push(d); });
  a.onclick = () => all.forEach(d => d.open = true); c.onclick = () => all.forEach(d => d.open = false);
  window.addEventListener('beforeprint', () => all.forEach(d => d.open = true));
});
if (D.tradeoffs) section('trade', 'Trade-offs and alternatives', s => { const tb = $('table', null, '<tr><th>Decision</th><th>Option A / Option B</th><th>How to choose</th></tr>');
  D.tradeoffs.forEach(r => { const tr = $('tr'); r.forEach(c => tr.appendChild($('td', null, fmt(c)))); tb.appendChild(tr); }); s.appendChild(tb); });
if (D.scale) section('scale', 'Scaling, reliability, failure modes', s => s.appendChild(ul(D.scale)));
const checks = [];
function checklist(parent, items, key){
  const saved = store.get(key) || [];
  items.forEach((t, i) => { const row = $('label', {className:'check'}); const cb = $('input', {type:'checkbox'}); cb.checked = !!saved[i];
    cb.onchange = () => { const v = checks.filter(c => c.key === key).map(c => c.cb.checked); store.set(key, v); updateProgress(); };
    checks.push({key, cb}); row.appendChild(cb); row.appendChild($('span', null, fmt(t))); parent.appendChild(row); });
}
if (D.followups) section('follow', 'Likely follow-up questions (tick when you can answer out loud)', s => checklist(s, D.followups, 'follow'));
if (D.pitfalls) section('pit', 'Common mistakes', s => s.appendChild(ul(D.pitfalls)));
if (D.script) section('script', 'Interview answer script (what to say, in order)', s => {
  s.appendChild($('p', null, 'Follow the 4-step framework. Press <b>Start mock timer</b> to rehearse against the clock; the current phase is highlighted.'));
  const tools = $('div', {className:'tools'}); const tm = $('span', {className:'timer'}, '00:00'); const bs = $('button', {className:'primary'}, 'Start mock timer'), br = $('button', null, 'Reset');
  tools.append(bs, br, tm); s.appendChild(tools);
  const total = D.script.reduce((a, r) => a + r[1], 0), cards = [];
  D.script.forEach(([ph, mins, say]) => { const c = $('div', {className:'phase'}); c.appendChild($('div', {className:'tag'}, '<b>' + esc(ph) + '</b><span class="muted">' + mins + ' min</span><div class="bar"><i style="width:' + (100*mins/total) + '%"></i></div>'));
    c.appendChild($('div', null, fmt(say))); s.appendChild(c); cards.push([c, mins]); });
  let sec = 0, iv = null; const draw = () => { const m = Math.floor(sec/60), x = sec % 60; tm.textContent = String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0');
    let acc = 0, hit = -1; cards.forEach(([c, mins], i) => { c.classList.remove('cur'); if (hit < 0 && sec < (acc + mins) * 60) hit = i; acc += mins; });
    if (hit >= 0 && iv) cards[hit][0].classList.add('cur'); };
  bs.onclick = () => { if (iv){ clearInterval(iv); iv = null; bs.textContent = 'Resume'; } else { iv = setInterval(() => { sec++; draw(); }, 1000); bs.textContent = 'Pause'; draw(); } };
  br.onclick = () => { clearInterval(iv); iv = null; sec = 0; bs.textContent = 'Start mock timer'; draw(); cards.forEach(([c]) => c.classList.remove('cur')); };
});
section('recap', '60-second recap / practice checklist', s => checklist(s, D.recap, 'recap'));
if (D.refs && D.refs.length) section('refs', 'References and further reading', s => { s.appendChild($('p', {className:'muted'}, 'Cross-checked against these sources.'));
  const u = $('ul'); D.refs.forEach(([t, h]) => u.appendChild($('li', null, '<a target="_blank" rel="noopener" href="' + esc(h) + '">' + esc(t) + '</a>'))); s.appendChild(u); });

// ---------- progress + toc
function updateProgress(){ const n = checks.length, d = checks.filter(c => c.cb.checked).length; document.getElementById('prog').style.width = (n ? 100*d/n : 0) + '%'; store.set('pct', n ? Math.round(100*d/n) : 0); }
updateProgress();
const toc = document.getElementById('toc'); sections.forEach(([id, t]) => { const a = $('a', {href:'#' + id}, esc(t.replace(/\(.*\)/,'').slice(0,34))); toc.appendChild(a); });
const links = [...toc.children];
window.addEventListener('scroll', () => { let cur = sections[0][0]; sections.forEach(([id]) => { if (document.getElementById(id).getBoundingClientRect().top < 120) cur = id; });
  links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur)); });
</script>
</body>
</html>
